name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    name: Skill catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Without PyYAML the validator falls back to a linter that catches less.
      # CI must use the same parser the skills CLI does.
      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate frontmatter, index, and identifiers
        run: python3 tools/validate_skills.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks needs history to scan commits, not just the working tree
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
