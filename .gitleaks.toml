# gitleaks configuration
#
# Splunk's KV store names its primary key field `_key`, and ITSI object
# identifiers are UUIDs. Every REST example in this repository therefore contains
# something shaped like `"_key":"fd1e636f-4cf5-499c-a161-c059b2408858"`, which
# trips the generic-api-key heuristic: a "key" token next to a high-entropy value.
#
# These are object identifiers in public documentation, not credentials. They
# grant no access on their own and are meaningless outside the stack that issued
# them.
#
# The allow-lists below match on line content only, and deliberately carry no
# `paths` criterion. A `paths` entry excuses every rule for the files it matches,
# so scoping these to `^skills/.*\.md$` would mean no secret of any kind could
# ever be reported inside a skill -- which is precisely where one would land.
# `condition = "AND"` does not constrain it either; that key has no effect on
# gitleaks 8.30.1. Verified with a probe file: while `paths` was present, a
# synthetic `secret =`, `apitoken:` and `password =` all went unreported; with it
# removed all three are caught and the documented `_key` UUID still passes.
#
# Real credentials are referenced in this repository only through environment
# variables (ITSI_URL, ITSI_TOKEN) and never as literals.

[extend]
useDefault = true

[[allowlists]]
description = "Splunk KV store _key fields and ITSI object UUIDs in documentation"
regexTarget = "line"
regexes = [
  # a line using Splunk's _key field: "_key":"...", _key=..., <svc_key>, etc.
  '''_key''',
]

[[allowlists]]
description = "Documented environment-variable credential references"
regexTarget = "line"
regexes = [
  '''os\.environ\[["'](?:ITSI_URL|ITSI_TOKEN)["']\]''',
  '''\$\{?(?:ITSI_URL|ITSI_TOKEN)\}?''',
]
